{{ define "main" }}

<div class="container homepage-sections" role="main">

  <!-- Optional blurb under the hero (keeps homepage tight) -->
  {{ with .Site.Params.homeBlurb }}
    <p class="homepage-blurb">
      {{ . | markdownify }}
    </p>
  {{ end }}

  {{ partial "home/feed-columns.html" . }}

  <!-- Mini Map -->
  <section class="mini-map-section">
    <h2 class="text-center">Where I've Been</h2>
    <a href="{{ "/map/" | relLangURL }}" class="mini-map-link">
      <div class="mini-map-container" id="mini-map-container">
        <!-- D3 renders the static SVG here -->
      </div>
    </a>
    <div class="text-center" style="margin-top: 1.2rem;">
      <a href="{{ "/map/" | relLangURL }}" class="mini-map-cta">Explore the Map &rarr;</a>
    </div>
  </section>

</div>

{{ end }}
