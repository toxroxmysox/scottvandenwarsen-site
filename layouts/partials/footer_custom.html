{{ if eq .Type "now" }}
<!-- Progressive card reveal + scroll-spy nav -->
<script>
(function () {
  var NAV_H = 60;
  var cards = Array.prototype.slice.call(document.querySelectorAll('.now-card'));
  var links = document.querySelectorAll('.now-nav-link');
  if (!cards.length) return;

  // Swap --hidden for --reveal class so CSS custom properties take over
  cards.forEach(function (c) {
    c.classList.remove('now-card--hidden');
    c.classList.add('now-card--reveal');
  });

  // Compute each card's visibility ratio (0–1) in the viewport
  function getVisibility(card) {
    var r = card.getBoundingClientRect();
    var top = Math.max(r.top, NAV_H);
    var bot = Math.min(r.bottom, window.innerHeight);
    var visible = Math.max(0, bot - top);
    return r.height > 0 ? visible / r.height : 0;
  }

  function update() {
    var ratios = cards.map(getVisibility);

    // Find the most-visible card index
    var activeIdx = 0;
    var maxRatio = 0;
    ratios.forEach(function (r, i) {
      if (r > maxRatio) { maxRatio = r; activeIdx = i; }
    });

    cards.forEach(function (card, i) {
      var ratio = ratios[i];
      var isAdj = Math.abs(i - activeIdx) === 1;

      // Card opacity: active = 1, adjacent = at least 0.5 (border hint), others = ratio
      var cardOp;
      if (i === activeIdx) {
        cardOp = 1;
      } else if (isAdj) {
        cardOp = Math.max(0.5, ratio);
      } else {
        cardOp = ratio;
      }

      // Content: visible when card is >75% in view
      var contentOp = ratio >= 0.75 ? 1 : 0;

      card.style.setProperty('--card-opacity', cardOp);
      card.style.setProperty('--content-opacity', contentOp);
    });

    // Update nav active state
    var activeId = cards[activeIdx].id;
    links.forEach(function (link) {
      link.classList.toggle('active', link.getAttribute('data-target') === activeId);
    });
  }

  // Throttled scroll handler
  var ticking = false;
  function onScroll() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(function () { update(); ticking = false; });
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  update(); // initial state

  // Click nav link to scroll
  links.forEach(function (link) {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      var target = document.getElementById(link.getAttribute('data-target'));
      if (target) {
        var y = target.getBoundingClientRect().top + window.pageYOffset - NAV_H - 20;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
    });
  });
}());
</script>
{{ end }}

{{ if and (eq .Kind "page") (eq .Section "gallery") }}
<!-- PhotoSwipe v4 init — JS + overlay HTML already injected by the theme on every page -->
<script>
(function () {
  var gallery = document.querySelector('.pswp-gallery');
  if (!gallery) return;

  var pswpEl = document.querySelector('.pswp');
  var links   = gallery.querySelectorAll('a[data-size]');

  // Build the items array from each link's href + data-size attribute.
  var items = [];
  Array.prototype.forEach.call(links, function (el) {
    var parts = el.getAttribute('data-size').split('x');
    var img   = el.querySelector('img');
    items.push({
      src:   el.href,
      w:     parseInt(parts[0], 10),
      h:     parseInt(parts[1], 10),
      msrc:  img ? img.src  : undefined,
      title: img ? img.alt  : undefined
    });
  });

  // Event delegation: walk up from the click target to find the <a data-size> link.
  gallery.addEventListener('click', function (e) {
    var target = e.target;
    while (target && target !== gallery) {
      if (target.tagName === 'A' && target.getAttribute('data-size')) {
        e.preventDefault();
        var index = -1;
        for (var i = 0; i < links.length; i++) {
          if (links[i] === target) { index = i; break; }
        }
        if (index >= 0) {
          var pswp = new PhotoSwipe(pswpEl, PhotoSwipeUI_Default, items, {
            index:           index,
            bgOpacity:       0.92,
            showHideOpacity: true,
            history:         false,
            shareEl:         false
          });
          pswp.init();
        }
        return;
      }
      target = target.parentNode;
    }
  });
}());
</script>

{{ if .Params.videos }}
<!-- Video lightbox — opens YouTube embed on thumbnail click, matches PhotoSwipe UX -->
<script>
(function () {
  var lightbox  = document.getElementById('videoLightbox');
  if (!lightbox) return;

  var player    = lightbox.querySelector('.video-lightbox-player');
  var titleEl   = document.getElementById('videoLightboxTitle');
  var captionEl = document.getElementById('videoLightboxCaption');
  var closeBtn  = lightbox.querySelector('.video-lightbox-close');

  function openVideo(videoId, title, caption) {
    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + videoId
               + '?autoplay=1&rel=0&modestbranding=1';
    iframe.setAttribute('allow', 'autoplay; encrypted-media');
    iframe.setAttribute('allowfullscreen', '');
    player.appendChild(iframe);

    titleEl.textContent   = title   || '';
    captionEl.textContent = caption || '';

    lightbox.classList.add('is-open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeVideo() {
    lightbox.classList.remove('is-open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    var iframe = player.querySelector('iframe');
    if (iframe) player.removeChild(iframe);
  }

  // Event delegation on the video grid
  var videoGallery = document.querySelector('.video-gallery');
  if (videoGallery) {
    videoGallery.addEventListener('click', function (e) {
      var trigger = e.target.closest('.video-trigger');
      if (trigger) {
        e.preventDefault();
        openVideo(
          trigger.getAttribute('data-video-id'),
          trigger.getAttribute('data-video-title'),
          trigger.getAttribute('data-video-caption')
        );
      }
    });
  }

  // Close when clicking outside the content area (backdrop, topbar, close button)
  lightbox.addEventListener('click', function (e) {
    if (!e.target.closest('.video-lightbox-content')) {
      closeVideo();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && lightbox.classList.contains('is-open')) {
      closeVideo();
    }
  });
}());
</script>
{{ end }}
