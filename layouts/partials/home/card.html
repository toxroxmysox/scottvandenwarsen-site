<article class="feed-card">
  <a href="{{ .RelPermalink }}" class="feed-card-link">
    <span class="feed-card-title">{{ .Title }}</span>
    {{ with .Params.summary }}
      <span class="feed-card-summary">{{ . }}</span>
    {{ end }}
    <span class="feed-card-meta">
      {{ if not .Date.IsZero }}
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      {{ end }}
      {{ with .Params.external_url }}
        <span class="feed-external-badge">External ↗</span>
      {{ end }}
    </span>
  </a>
</article>
