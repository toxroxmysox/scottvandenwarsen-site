<a href="{{ .RelPermalink }}" class="gallery-card">
  {{ with .Params.cover }}
    {{ with $.Resources.GetMatch . }}
      <img
        src="{{ .RelPermalink }}"
        alt="{{ $.Title }}"
        class="gallery-card-img"
        loading="lazy"
      >
    {{ end }}
  {{ end }}
  <div class="gallery-card-overlay">
    <span class="gallery-card-title">{{ .Title }}</span>
    {{ with .Params.summary }}
      <span class="gallery-card-summary">{{ . }}</span>
    {{ end }}
  </div>
</a>
