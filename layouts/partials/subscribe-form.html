{{ with .Site.Params.buttondownFormAction }}
<div class="subscribe-form">
  <p class="subscribe-label">Get new posts delivered to your inbox</p>
  <form method="POST" action="{{ . }}" class="subscribe-inline">
    <input type="email" name="email" placeholder="Your email" required class="subscribe-input" />
    <button type="submit" class="subscribe-btn">Subscribe</button>
    <!-- Honeypot — hidden from humans, traps bots -->
    <div style="position: absolute; left: -5000px;" aria-hidden="true">
      <input type="text" name="a_password" tabindex="-1" autocomplete="off" />
    </div>
  </form>
</div>
{{ end }}
