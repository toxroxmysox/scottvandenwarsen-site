baseURL = "https://scott.vandenwarsen.com/"
languageCode = 'en-us'
title = "Scott Vanden Warsen"
enableRobotsTXT = true
googleAnalytics = "G-MPJWD25QBM"
disableHugoGeneratorInject = true
canonifyURLs = true

[params]
  homeBlurb = "Welcome to an inside look at what I'm thinking about and want to share with others."

  # How many items appear per feed column (Reading / Watching / Listening) on the homepage.
  # Increase to show more recent items in each column.
  feedItemLimit = 5

  # How many albums appear in the gallery grid on the homepage.
  galleryAlbumLimit = 6

  description = ""

  # Show related posts on feed single pages (matched by shared tags).
  showRelatedPosts = true
  related_content_limit = 4

  # Show RSS icon in the site footer.
  rss = true

  # Cusdis comment widget — App ID from https://cusdis.com dashboard.
  cusdisAppId = "0785bc96-57da-40d3-8271-6f5fbcbd0cb7"

  # Buttondown email subscription — form action URL.
  # Set this after creating your Buttondown account:
  # buttondown.com → Settings → Forms → copy the embed subscribe URL.
  buttondownFormAction = "https://buttondown.com/api/emails/embed-subscribe/scottvandenwarsen"

[params.author]
  name = "Scott Vanden Warsen"
  website = "https://scott.vandenwarsen.com"
  linkedin = "scott-vanden-warsen"

[taxonomies]
  tag = "tags"

[outputFormats.GalleryJSON]
  mediaType = "application/json"
  baseName = "galleries"
  isPlainText = true

[outputFormats.TripsJSON]
  mediaType = "application/json"
  baseName = "trips"
  isPlainText = true

[outputs]
  home = ["HTML", "RSS", "GalleryJSON", "TripsJSON"]

[imaging.exif]
  includeFields = "Orientation"
  disableDate = true
  disableLatLong = true
