baseURL = "https://scottvandenwarsen.com/"
languageCode = 'en-us'
title = "Scott Vanden Warsen"
theme = "beautifulhugo"
enableRobotsTXT = true
canonifyURLs = true

[params]
  homeBlurb = "Welcome to an inside look at what I'm thinking about and want to share with others."

  # How many items appear per feed column (Reading / Watching / Listening) on the homepage.
  # Increase to show more recent items in each column.
  feedItemLimit = 5

  # How many albums appear in the gallery grid on the homepage.
  galleryAlbumLimit = 6

[outputFormats.GalleryJSON]
  mediaType = "application/json"
  baseName = "galleries"
  isPlainText = true

[outputs]
  home = ["HTML", "RSS", "GalleryJSON"]
